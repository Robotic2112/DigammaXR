
name: Build DigammaXR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DigammaXR-build
          path: '**/build/libs/*.jar'
